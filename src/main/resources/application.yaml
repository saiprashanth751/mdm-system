server:
  port: 8081

spring:
  application:
    name: mdm-system

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5433/mdm_db
    username: mdm_user
    password: mdm_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # Kafka — Event-driven async processing
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: mdm-schedule-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.moveinsync.mdm.event

# JWT Configuration
app:
  jwt:
    secret: 4d6f766549536e7963204d444d2053797374656d205365637265744b6579466f724a575420546f6b656e2047656e65726174696f6e
    expiration: 86400000  # 24 hours in milliseconds
  scheduler:
    inactive-threshold-days: 7
    inactive-check-interval-ms: 3600000   # 1 hour
    max-retry-count: 3
    retry-check-interval-ms: 1800000      # 30 minutes

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Logging — ECS (Elastic Common Schema) JSON for production observability
logging:
  level:
    root: INFO
    com.moveinsync.mdm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  structured:
    format:
      console: ecs  # Spring Boot 3.4+: native ECS JSON structured logging

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
