# Test configuration — uses H2 in-memory database with Kafka/Flyway disabled.
# This enables the @SpringBootTest context load test to work without external
# infrastructure while still verifying Spring wiring and bean creation.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none

app:
  jwt:
    secret: 4d6f766549536e7963204d444d2053797374656d205365637265744b6579466f724a575420546f6b656e2047656e65726174696f6e
    expiration: 86400000
  scheduler:
    inactive-threshold-days: 7
    inactive-check-interval-ms: 3600000
    max-retry-count: 3
    retry-check-interval-ms: 1800000
